<div style="padding: 16px; display: flex; justify-content: center;">
    <mat-card style="width: fit-content">
        <form class="student-entry-form" [formGroup]="studentDetailsForm">

            <div class="student-entry-form__form-row">
                Full Name
                <div class="student-entry-form__form-row--input-section">
                    <mat-form-field class="form-group full-width">
                        <mat-label>Name</mat-label>
                        <input matInput type="text" formControlName="name" placeholder="Name">
                    </mat-form-field>
                </div>
            </div>

            <div class="student-entry-form__form-row">
                Origin
                <div class="student-entry-form__form-row--input-section">
                    <mat-form-field class="form-group">
                        <mat-label>Country</mat-label>
                        <input matInput type="text" formControlName="country" placeholder="Country">
                    </mat-form-field>

                    <mat-form-field class="form-group">
                        <mat-label>State</mat-label>
                        <input matInput type="text" formControlName="state" placeholder="State">
                    </mat-form-field>
                </div>
            </div>

            <div class="student-entry-form__form-row">
                Declaration
                <div class="student-entry-form__form-row--input-section">
                    <mat-form-field class="form-group">
                        <mat-label>Passport Declaration</mat-label>
                        <input matInput type="text" formControlName="passportDeclaration"
                            placeholder="Passport Declaration">
                    </mat-form-field>

                    <mat-form-field class="form-group">
                        <mat-label>Fitness Declaration</mat-label>
                        <input matInput type="text" formControlName="fitnessDeclaration"
                            placeholder="Fitness Declaration">
                    </mat-form-field>
                </div>
            </div>

            <div class="student-entry-form__form-row">
                Course Name
                <div class="student-entry-form__form-row--input-section">
                    <mat-form-field class="form-group">
                        <mat-label>Course Name</mat-label>
                        <input matInput type="text" formControlName="courseName" placeholder="Course Name">
                    </mat-form-field>

                    <mat-form-field class="form-group">
                        <mat-label>Subjects</mat-label>
                        <input matInput type="text" formControlName="subjects" placeholder="Subject">
                    </mat-form-field>
                </div>
            </div>

            <div class="student-entry-form__form-row">
                Birth Date
                <div class="student-entry-form__form-row--input-section">
                    <mat-form-field>
                        <mat-label>Birth Date</mat-label>
                        <input matInput [matDatepicker]="picker" formControlName="date" placeholder="Birth Date">
                        <mat-hint>MM/DD/YYYY</mat-hint>
                        <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
                        <mat-datepicker #picker></mat-datepicker>
                    </mat-form-field>
                </div>
            </div>

            <div class="student-entry-form__form-row">
                Present Address

                <div class="student-entry-form__form-row--input-address">
                    <mat-form-field class="form-group">
                        <mat-label>Street Address</mat-label>
                        <input matInput type="text" formControlName="street" placeholder="Street Address" />
                    </mat-form-field>

                    <mat-form-field class="form-group">
                        <mat-label>Address 2</mat-label>
                        <input matInput type="text" formControlName="address2" placeholder="Address 2" />
                    </mat-form-field>

                    <mat-form-field class="form-group">
                        <mat-label>Email Address</mat-label>
                        <input matInput type="text" formControlName="email" placeholder="Email" />
                    </mat-form-field>
                </div>

                <div class="student-entry-form__form-row--input-section">
                    <mat-form-field class="form-group">
                        <mat-label>State</mat-label>
                        <input matInput disabled [value]="studentDetailsForm.get('state')?.value" type="text" />
                    </mat-form-field>

                    <mat-form-field class="form-group">
                        <mat-label>City</mat-label>
                        <input matInput type="text" formControlName="city" />
                    </mat-form-field>
                </div>

                <div class="student-entry-form__form-row--input-section">
                    <mat-form-field class="form-group">
                        <mat-label>Postal Code</mat-label>
                        <input matInput formControlName="zip" placeholder="Postal code" />
                    </mat-form-field>

                    <mat-form-field class="form-group">
                        <mat-label>Country</mat-label>
                        <input matInput disabled [value]="studentDetailsForm.get('country')?.value">
                    </mat-form-field>
                </div>

                <div class="student-entry-form__form-row--input-buttons">
                    <button type="submit" color="primary" [disabled]="studentDetailsForm.invalid" mat-button (click)="onSubmit()">
                        Submit
                    </button>

                    <button type="button" color="accent" mat-button>
                        Cancel
                    </button>
                </div>

            </div>

        </form>
    </mat-card>
</div>
